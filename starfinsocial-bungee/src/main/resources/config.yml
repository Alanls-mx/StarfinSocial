proxy-id: proxy-1
locale: pt_BR
mysql:
  host: localhost
  port: 3306
  database: starfin
  username: starfin
  password: CHANGE_ME
  ssl-mode: PREFERRED
party:
  enabled: true
  default-max-members: 16
  absolute-max-members: 32
  invite-expiration-seconds: 60
  invite-cooldown-seconds: 3
  leader-disconnect:
    grace-period-seconds: 120
    transfer-on-timeout: true
  privacy:
    default: INVITE_ONLY
  chat:
    enabled: true
    cooldown-seconds: 1
  network:
    cross-server: true
    presence-timeout-seconds: 30
  aliases:
    p: true
    pc: true
  permissions:
    default-actions:
      - use
      - create
      - invite
      - kick
      - promote
      - transfer
      - disband
      - chat
      - settings
friends:
  enabled: true
  default-max-friends: 50
  per-page: 10
  permissions:
    default-actions:
      - use
      - add
      - accept
      - deny
      - remove
      - list
      - requests
      - settings
  permission-limits:
    starfinsocial.friend.limit.100: 100
    starfinsocial.friend.limit.250: 250
    starfinsocial.friend.limit.500: 500
friend-requests:
  enabled: true
  expiration-days: 7
  cooldown-seconds: 5
  max-pending-sent: 25
  allow-offline-requests: true
friend-settings:
  default:
    allow-requests: true
    notify-friend-online: true
    notify-friend-offline: false
    show-online-status: true
    show-current-server: true
    allow-party-invites-from-friends: true
